name: pombo

on:
  push:
    branches: [main]
    paths: ["apps/pombo/**", ".github/workflows/pombo.yml"]
  pull_request:
    paths: ["apps/pombo/**", ".github/workflows/pombo.yml"]

defaults:
  run:
    working-directory: apps/pombo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/pombo/go.mod
          cache-dependency-path: apps/pombo/go.mod

      - run: make lint
      - run: make test

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/pombo/Dockerfile

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # No QEMU: the Dockerfile cross-compiles Go for each platform.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/pombo
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: apps/pombo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pombo
          cache-to: type=gha,mode=max,scope=pombo
